name: Discovery Python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare isolated Python environment
        run: |
          python3 -m venv .venv-discovery
          .venv-discovery/bin/python -m pip install -r tools/discovery/requirements.txt
      - name: Run bounded discovery regressions (offline)
        run: |
          .venv-discovery/bin/python -m compileall -q tools/discovery
          .venv-discovery/bin/python -m unittest discover -s tests/discovery -v
