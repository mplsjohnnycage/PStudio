name: Rivet Integration

on:
  pull_request:
    paths:
      - "apps/worker/**"
      - "package-lock.json"
      - ".github/workflows/rivet-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivet-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rivet-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      RUST_LOG: warn
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test real Rivet workflow engine
        run: npm run test:integration -w @prospect-studio/worker
