name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [check, check-types, test, build]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # Build-only placeholders. No integration or production services are accessed.
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/prospect_test
      CORS_ORIGIN: http://127.0.0.1:3001
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Check tool versions
        run: |
          node --version
          test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ${{ matrix.check }}
        run: npm run "${{ matrix.check }}"
